[project]
name = "pd-scoring-service"
version = "1.0.0"
description = "Probability-of-default scoring API (FastAPI)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx`:DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
