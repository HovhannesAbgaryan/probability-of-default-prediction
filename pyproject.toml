[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pd-model"
version = "1.1.0"
description = "Probability-of-default model: data cleaning, preprocessing, training and validation."
requires-python = ">=3.11"
# Runtime deps: everything needed to load the saved preprocessor/model and score (used by the service).
# Pinned to the versions the artifacts are trained with: a pickled sklearn object must be loaded with
# the same sklearn version.
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.1",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Model development: candidates, statistics, notebooks.
train = [
    "scipy==1.18.1",
    "statsmodels==0.15.0",
    "lightgbm==4.7.0",
    "xgboost==3.4.1",
    "pyarrow==26.0.1",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "shap==0.54.1",
]
dev = [
    "pd-model[train]",
    "pytest>=8.0",
    "jupyter==1.1.1",
    "ipykernel==7.4.0",
    "nbformat==5.11.1",
    "nbconvert==7.17.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
